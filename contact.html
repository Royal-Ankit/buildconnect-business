<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact - NIRMAZA</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e785a"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><script src="apps.js"></script><script src="theme.js"></script><script src="nz-ui.js"></script>
<link rel="stylesheet" href="plumbing.css">
<style>
  .doc{max-width:820px;margin:0 auto;padding:8px 4px 20px}.doc h1{font-size:32px;margin:18px 0 6px;letter-spacing:-.02em}.doc .upd{color:var(--muted);font-size:13px;margin:0 0 20px}
  .doc h2{font-size:19px;margin:26px 0 6px;color:var(--dark)}.doc p,.doc li{line-height:1.7;font-size:15.5px}.doc ul{padding-left:22px}
  .doc .box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px 24px;margin:14px 0;box-shadow:0 8px 24px rgba(15,27,61,.06)}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}.g3 .box{margin:0}.g3 b{display:block;font-size:17px;margin-bottom:4px}
  .back{display:inline-block;margin-top:6px;font-weight:700}
</style>
</head>
<body>
<header><div class="bar"><a class="logo" href="index.html">NIR<span>MAZA</span></a><a href="index.html" class="back" style="margin:0">&larr; Home</a></div></header>
<main><div class="doc">
<h1>Contact us</h1><p class="upd">We usually reply within one working day.</p>
<div class="box" id="cbox"><p style="margin:0">Loading...</p></div>
<div class="g3"><div class="box"><b>I am a customer</b>Looking for a professional? <a href="quote.html">Send a requirement</a> and we will pass it on.</div>
<div class="box"><b>I am a business</b>Want to be listed? Create a free account in the NIRMAZA Business app.</div></div>
<script>
(function(){var c=(window.NZ&&NZ.CONTACT)||{},r=[];
if(c.email)r.push('<p><b>Email</b><br><a href="mailto:'+NZ.esc(c.email)+'">'+NZ.esc(c.email)+'</a></p>');
if(c.phone)r.push('<p><b>Phone</b><br><a href="tel:'+NZ.esc(c.phone)+'">'+NZ.esc(c.phone)+'</a></p>');
if(c.whatsapp)r.push('<p><b>WhatsApp</b><br><a href="https://wa.me/'+NZ.esc(String(c.whatsapp).replace(/\D/g,''))+'">'+NZ.esc(c.whatsapp)+'</a></p>');
if(c.address)r.push('<p><b>Location</b><br>'+NZ.esc(c.address)+'</p>');
document.getElementById('cbox').innerHTML=r.join('')||'<p style="margin:0">Please use the Send a requirement option below and we will get back to you.</p>';})();
</script>
</div></main>
</body>
</html>
